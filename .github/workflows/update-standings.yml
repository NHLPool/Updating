name: Update NHL Standings

on:
  schedule:
    # Every 30 minutes. GitHub cron times are UTC.
    - cron: "7,37 * * * *"

  # Allows manual testing from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nhl-standings
  cancel-in-progress: true

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download standings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          API_URL="https://api-web.nhle.com/v1/standings/now"
          TEMP_FILE="data/standings.tmp.json"
          FINAL_FILE="data/standings.json"

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 60 \
            --output "$TEMP_FILE" \
            "$API_URL"

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          temp_file = Path("data/standings.tmp.json")
          final_file = Path("data/standings.json")

          with temp_file.open("r", encoding="utf-8") as handle:
              response = json.load(handle)

          standings = response.get("standings")

          if not isinstance(standings, list) or len(standings) < 30:
              raise RuntimeError(
                  f"Invalid NHL response: expected at least 30 teams, "
                  f"received {len(standings) if isinstance(standings, list) else 0}"
              )

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "https://api-web.nhle.com/v1/standings/now",
              "standings": standings
          }

          with final_file.open("w", encoding="utf-8") as handle:
              json.dump(output, handle, ensure_ascii=False, separators=(",", ":"))

          temp_file.unlink(missing_ok=True)

          print(f"Validated and saved {len(standings)} teams.")
          PY

      - name: Commit updated standings
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/standings.json; then
            echo "Standings have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/standings.json
          git commit -m "Update NHL standings"
          git push
