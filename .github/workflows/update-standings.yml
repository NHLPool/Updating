name: Update NHL Standings

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch NHL standings
        run: |
          mkdir -p standings

          curl -L \
            "https://api-web.nhle.com/v1/standings/now" \
            -o standings.json

      - name: Validate JSON
        run: |
          jq empty standings.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add standings.json

          git diff --cached --quiet && exit 0

          git commit -m "Update NHL standings"
          git push
